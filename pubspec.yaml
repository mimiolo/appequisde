name: pruebas
description: App de Gestión de Usuarios con Login, Roles, 2FA, Pagos y más
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.0
  shared_preferences: ^2.2.2
  fl_chart: ^0.68.0
  share_plus: ^9.0.0
  mailer: ^6.0.1
  local_auth: ^2.1.8
  url_launcher: ^6.2.4
  flutter_local_notifications: ^17.2.1
  geolocator: ^12.0.0
  http: ^1.1.2
  webview_flutter: ^4.7.0
  xml: ^6.5.0                          # ⚡ NUEVO: para parsear el XML
  encrypt: ^5.0.3
  sqflite_common_ffi_web: ^0.4.3+1
  webview_flutter_web: ^0.2.3+4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/punto_red.xml              # ⚡ NUEVO: el archivo XML
